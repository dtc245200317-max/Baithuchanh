<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập nhúng CSS</title>
    
    <!-- Sửa lỗi: Liên kết tệp CSS bên ngoài (External-style) -->
    <link rel="stylesheet" href="style.css">

    <!-- Giữ nguyên Internal-style (Đã đạt điểm) -->
    <style>
        .van-ban-internal {
            color: blue;
        }
    </style>
</head>
<body>

    <!-- Sửa lỗi: Thêm thuộc tính style trực tiếp vào thẻ HTML (Inline-style) -->
    <h1 style="color: red;">Đây là tiêu đề sử dụng Inline-style</h1>

    <p class="van-ban-internal">Đây là đoạn văn bản sử dụng Internal-style (Màu xanh dương).</p>
    
    <p class="van-ban-external">Đây là đoạn văn bản sử dụng External-style (Màu xanh lá).</p>

</body>
</html>
