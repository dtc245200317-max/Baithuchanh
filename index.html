<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thực hành nhúng CSS</title>
    
    <!-- PHẦN 3: External-style (Nhúng file CSS từ bên ngoài vào) -->
    <link rel="stylesheet" href="style.css">

    <!-- PHẦN 2: Internal-style (Viết CSS trực tiếp bên trong thẻ <style> của phần <head>) -->
    <style>
        .doan-van-internal {
            color: green; /* Đổi chữ thành màu xanh lá */
        }
    </style>
</head>
<body>

    <!-- PHẦN 1: Inline-style (Viết CSS trực tiếp bằng thuộc tính style="" ngay trong thẻ HTML) -->
    <h1 style="color: red;">Đây là tiêu đề được dùng Inline-style (Màu đỏ)</h1>

    <p class="doan-van-internal">Đây là đoạn văn bản được dùng Internal-style (Màu xanh lá).</p>
    
    <p class="doan-van-external">Đây là đoạn văn bản được dùng External-style (Màu xanh dương).</p>

</body>
</html>
